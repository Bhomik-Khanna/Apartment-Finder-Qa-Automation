[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Pure unit tests with zero external dependencies
    data: Data integrity and schema validation tests
    apptest: Headless Streamlit AppTest runner
    e2e: End-to-end browser automation tests via Playwright
    regression: Bug reproduction and regression guard tests
    slow: Tests that take longer to execute
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning